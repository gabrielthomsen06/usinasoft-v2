services:
  db:
    image: postgres:15-alpine
    container_name: usinasoft_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - usinasoft_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: usinasoft_backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required in .env (min 32 chars)}
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost","https://${DOMAIN:-localhost}"]
      - DEBUG=${DEBUG:-false}
      - EMPRESA_CNPJ=${EMPRESA_CNPJ:?EMPRESA_CNPJ is required in .env (14 digits)}
    # Porta exposta apenas na rede interna Docker (frontend faz proxy via Nginx)
    # Não mapeia porta externa para evitar conflito com Airbyte na 8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - usinasoft_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: usinasoft_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - usinasoft_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  usinasoft_network:
    driver: bridge
